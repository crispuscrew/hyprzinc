name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The runner image is pinned rather than `ubuntu-latest`: every job here drives podman, so
# the runner's podman/crun pair is part of this build's toolchain, and `latest` moves it
# without warning. Two skews have already cost us a red build - podman 4.9 not
# understanding the `--health-cmd` exec form, and crun rejecting the OCI spec version
# podman handed it. Bump this deliberately, with the podman version in mind.
jobs:
  common:
    name: common (schema + validate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Through the pinned container like every other module, not a host Go. `common` is a
      # library, not an e2e suite, so it gets no exception from golden rule 1: a floating
      # setup-go resolves to whatever 1.24.x is newest at job time, which is the version
      # skew GOTOOLCHAIN=local and the digest pin exist to prevent.
      - run: .github/scripts/ensure-podman.sh
      - run: make -C common check
      # common vendors yaml.v3, so it can drift like any other module - and `check` would
      # not notice, since it builds from the vendored copy.
      - run: make -C common vendor-check

  check:
    name: check + build (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [container/runner, creator, launcher/tui, launcher/gui, virtualization/runner]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure podman
        run: .github/scripts/ensure-podman.sh
      - name: make check
        run: make -C ${{ matrix.module }} check
      - name: make vendor-check
        run: make -C ${{ matrix.module }} vendor-check
      - name: make build
        run: make -C ${{ matrix.module }} build
      - name: make repro
        run: make -C ${{ matrix.module }} repro

  launcher-common:
    name: launcher/common (shared launcher lib)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Ensure podman
        run: .github/scripts/ensure-podman.sh
      - name: make check
        run: make -C launcher/common check
      - name: make vendor-check
        run: make -C launcher/common vendor-check

  menu:
    name: menu (menu lib)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Ensure podman
        run: .github/scripts/ensure-podman.sh
      - name: make check
        run: make -C menu check
      - name: make vendor-check
        run: make -C menu vendor-check

  nix:
    name: nix flake (consumer build path)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned by commit SHA rather than by tag: a tag is mutable, and this action installs a
      # package manager into the job. v31.11.0 at the time of pinning.
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # --no-update-lock-file makes the committed flake.lock load bearing. Without it, nix
      # silently resolves and writes a fresh lock when flake.nix and flake.lock disagree, so
      # the job would go green against inputs nobody reviewed and the lock would drift
      # unnoticed. With it, that disagreement is what fails the build.
      #
      # Every tool, not just one: they are five separate Go modules with their own vendor
      # trees, and a flake that builds zc proves nothing about zlg.
      - name: build every tool through the flake
        run: nix build --no-update-lock-file --no-link --print-build-logs .#zc .#zcr .#zvr .#zlt .#zlg
      # The build succeeding is not the claim ZDE cares about - the claim is that what comes
      # out runs and is the version it says. This is the assertion a consumer can point at.
      - name: the flake's binaries run and report their version
        run: |
          got="$(nix run --print-build-logs .#zc -- version)"
          echo "zc reports: $got"
          case "$got" in
            *v0.10.0*) ;;
            *) echo "expected the flake version from 'zc version', got: $got" >&2; exit 1 ;;
          esac

  e2e:
    name: end-to-end (podman)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false # common and e2e have no external deps, so there is nothing to cache
      - name: Ensure podman
        run: .github/scripts/ensure-podman.sh
      - name: make e2e
        run: make -C container/e2e e2e
        # A runner without rootless nftables can gate just the network scenario with:
        #   env:
        #     ZINC_E2E_NO_NET: "1"
