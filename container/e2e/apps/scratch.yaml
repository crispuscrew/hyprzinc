SchemaVersion: 3
Type: ZincContainer
AppNameID: scratch
Description: scratch-volume scenario - an anonymous volume is a tmpfs whose size the kernel holds
ImageMeta:
  Image: localhost/zinc/e2e-app:local
StartConditions:
  Entrypoint: /scratch.sh
Volumes:
  - InnerMount: /scratch
    Writable: true
    SizeLimited: true
    SizeLimitMiB: 8
  - InnerMount: /readonly
